spring.application.name=event_management
spring.datasource.url=${DB_URL}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

#server.port=8080
#server.address=0.0.0.0
#server.forward-headers-strategy=framework
#server.tomcat.remoteip.remote-ip-header=x-forwarded-for
#server.tomcat.remoteip.protocol-header=x-forwarded-proto


# Flyway settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# chapa config
chapa_public_key=${chapa_public_key}
chapa_secret_key=${chapa_secret_key}
chapa_encryption_key=${chapa_encryption_key}

#tunnel
BASE_URL=https://suitable-heartily-stallion.ngrok-free.app
CHAPA_SUCCESS_ENDPOINT=''
CHAPA_WEBHOOK_ENDPOINT=''


